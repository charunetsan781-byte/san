<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Washing Machine</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>body{margin:0}#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999}button{padding:12px 20px;margin:5px}</style>
</head>
<body>
<div id="controls">
<button onclick="increaseSpeed()">เพิ่มความเร็ว</button>
<button onclick="decreaseSpeed()">ลดความเร็ว</button>
<button onclick="toggleLid()">เปิด/ปิดฝา</button>
</div>
<a-scene embedded arjs="sourceType: webcam;">
<a-marker preset="hiro">
<a-box position="0 0.5 0" width="1" height="1" depth="0.8" color="#e0e0e0"></a-box>
<a-cylinder id="drum" position="0 0.6 0" radius="0.25" height="0.5" rotation="90 0 0" color="#2196f3"></a-cylinder>
<a-box id="lid" position="0 1.05 0" width="0.8" height="0.05" depth="0.6" color="#424242"></a-box>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
let speed=1,lidOpen=false;
function increaseSpeed(){speed+=1;}
function decreaseSpeed(){if(speed>0)speed-=1;}
function toggleLid(){const lid=document.querySelector('#lid');if(!lidOpen){lid.setAttribute('animation','property: rotation; to: -100 0 0; dur: 800');lidOpen=true;}else{lid.setAttribute('animation','property: rotation; to: 0 0 0; dur: 800');lidOpen=false;}}
AFRAME.registerComponent('rotate-drum',{tick:function(){let rot=this.el.getAttribute('rotation');this.el.setAttribute('rotation',`${rot.x} ${rot.y} ${rot.z+speed}`);}});
window.onload=()=>{document.querySelector('#drum').setAttribute('rotate-drum','');};
</script>
</body>
</html>
